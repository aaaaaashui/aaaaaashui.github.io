<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>联系 · 水野俊</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="shell page">
    <h2 data-i18n="contactTitle"></h2>
    <p class="lead" data-i18n="contactLead"></p>
    <div class="contact-list" style="margin-top: 28px">
      <div class="contact-item">
        <div class="contact-info">
          <strong data-i18n="emailLabel"></strong>
          <a class="contact-value" href="mailto:2731399865@qq.com">2731399865@qq.com</a>
        </div>
        <button class="copy-btn" type="button" data-copy="2731399865@qq.com" data-i18n="copyBtn"></button>
      </div>
      <div class="contact-item">
        <div class="contact-info">
          <strong data-i18n="wechatLabel"></strong>
          <img class="wechat-qr" data-local src="images/wechat-qr.jpg" alt="微信二维码">
          <p class="qr-hint" data-i18n="wechatQRHint"></p>
        </div>
      </div>
    </div>
  </main>
  <script src="js/main.js"></script>
</body>
</html>
