<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>关于我 · 水野俊</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="shell hero enter-v">
    <div class="hero-head">
      <div class="avatar-wrap">
        <img data-local src="images/avatar.jpg" alt="">
      </div>
      <div class="hero-text">
        <p class="eyebrow" data-i18n="homeEyebrow"></p>
        <h1 data-i18n="homeTitle"></h1>
        <p class="lead" data-i18n="homeLead"></p>
        <div class="tags">
          <span class="tag" data-i18n="tag1"></span>
          <span class="tag" data-i18n="tag2"></span>
          <span class="tag" data-i18n="tag3"></span>
          <span class="tag" data-i18n="tag4"></span>
        </div>
        <div class="actions">
          <a class="btn btn-primary" href="contact.html" data-i18n="ctaContact"></a>
          <a class="btn btn-ghost" href="experience.html" data-i18n="ctaExp"></a>
        </div>
      </div>
    </div>

    <section style="margin-top: 60px">
      <h2 data-i18n="aboutTitle"></h2>
      <div class="split even" style="margin-top: 20px">
        <article class="card">
          <p class="muted" data-i18n="aboutP1"></p>
        </article>
        <article class="card">
          <p class="muted" data-i18n="aboutP2"></p>
        </article>
      </div>
      <div class="highlight">
        <p data-i18n="aboutP3"></p>
      </div>
    </section>

    <div class="cards three" style="margin-top: 12px">
      <article class="card">
        <p class="kicker">01</p>
        <h3 data-i18n="fact1Title"></h3>
        <p class="muted" data-i18n="fact1Body"></p>
      </article>
      <article class="card">
        <p class="kicker">02</p>
        <h3 data-i18n="fact2Title"></h3>
        <p class="muted" data-i18n="fact2Body"></p>
      </article>
      <article class="card">
        <p class="kicker">03</p>
        <h3 data-i18n="fact3Title"></h3>
        <p class="muted" data-i18n="fact3Body"></p>
      </article>
    </div>
  </main>
  <script src="js/main.js"></script>
</body>
</html>
