<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>技能 · 水野俊</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="shell page">
    <h2 data-i18n="skillsTitle"></h2>
    <p class="lead" data-i18n="skillsLead"></p>

    <!-- 技能目前是占位内容：改这里面的文字即可，想要换语言就在 js/main.js 里同步改中英文 -->
    <div class="skills-grid" style="margin-top: 28px">
      <article class="card skill-cat">
        <h3 data-i18n="skCatProg"></h3>
        <div class="skill-pills">
          <span class="skill-pill">Python</span>
        </div>
      </article>
      <article class="card skill-cat">
        <h3 data-i18n="skCatOffice"></h3>
        <div class="skill-pills">
          <span class="skill-pill">Word</span>
          <span class="skill-pill">Excel</span>
          <span class="skill-pill">PowerPoint</span>
        </div>
      </article>
      <article class="card skill-cat">
        <h3 data-i18n="skCatLang"></h3>
        <div class="skill-pills">
          <span class="skill-pill" data-i18n="skEnglish"></span>
          <span class="skill-pill" data-i18n="skMandarin"></span>
          <span class="skill-pill" data-i18n="skJapanese"></span>
        </div>
      </article>
      <article class="card skill-cat">
        <h3 data-i18n="skCatLearn"></h3>
        <div class="skill-pills">
          <span class="skill-pill" data-i18n="skCsbase"></span>
          <span class="skill-pill" data-i18n="skDs"></span>
          <span class="skill-pill" data-i18n="skC"></span>
        </div>
      </article>
    </div>
  </main>
  <script src="js/main.js"></script>
</body>
</html>
