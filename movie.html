<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>影视 · 水野俊</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="theme-movie">
  <main class="shell page enter-h">
    <a class="back-link" href="interests.html" data-transition data-i18n="backLink"></a>
    <h2 data-i18n="movieTitle"></h2>
    <p class="lead" data-i18n="movieLead"></p>
    <div class="item-list">
      <div class="item-card">
        <div class="item-text">
          <h3 data-i18n="movieI1Title"></h3>
        </div>
        <div class="item-photo">
          <img data-local src="images/movie-1.jpg" alt="">
          <p data-i18n="movieI1Photo"></p>
        </div>
      </div>
      <div class="item-card">
        <div class="item-text">
          <h3 data-i18n="movieI2Title"></h3>
        </div>
        <div class="item-photo">
          <img data-local src="images/movie-2.jpg" alt="">
          <p data-i18n="movieI2Photo"></p>
        </div>
      </div>
      <div class="item-card">
        <div class="item-text">
          <h3 data-i18n="movieI3Title"></h3>
        </div>
        <div class="item-photos">
          <div class="item-photo">
            <img data-local src="images/movie-3.jpg" alt="">
            <p data-i18n="movieI3Photo"></p>
          </div>
          <div class="item-photo">
            <img data-local src="images/movie-3b.jpg" alt="">
            <p data-i18n="movieI3Photo2"></p>
          </div>
          <div class="item-photo">
            <img data-local src="images/movie-3c.jpg" alt="">
            <p data-i18n="movieI3Photo3"></p>
          </div>
        </div>
      </div>
      <div class="item-card item-card--text">
        <div class="item-text">
          <h3 data-i18n="movieI4Title"></h3>
        </div>
      </div>
    </div>
  </main>
  <script src="js/main.js"></script>
</body>
</html>
