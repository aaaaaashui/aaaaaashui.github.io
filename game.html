<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>游戏 · 水野俊</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="theme-game">
  <main class="shell page enter-h">
    <a class="back-link" href="interests.html" data-transition data-i18n="backLink"></a>
    <h2 data-i18n="gameTitle"></h2>
    <p class="lead" data-i18n="gameLead"></p>
    <div class="item-list">
      <div class="item-card">
        <div class="item-text">
          <h3 data-i18n="gameI1Title"></h3>
          <p class="muted" data-i18n="gameI1Body"></p>
        </div>
        <div class="item-photo">
          <img data-local src="images/game-1.jpg" alt="">
          <p data-i18n="gameI1Photo"></p>
        </div>
      </div>
      <div class="item-card">
        <div class="item-text">
          <h3 data-i18n="gameI2Title"></h3>
          <p class="muted" data-i18n="gameI2Body"></p>
        </div>
        <div class="item-photo">
          <img data-local src="images/game-2.jpg" alt="">
          <p data-i18n="gameI2Photo"></p>
        </div>
      </div>
      <div class="item-card">
        <div class="item-text">
          <h3 data-i18n="gameI3Title"></h3>
          <p class="muted" data-i18n="gameI3Body"></p>
        </div>
        <div class="item-photo">
          <img data-local src="images/game-3.jpg" alt="">
          <p data-i18n="gameI3Photo"></p>
        </div>
      </div>
    </div>
  </main>
  <script src="js/main.js"></script>
</body>
</html>
