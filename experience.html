<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>经历 · 水野俊</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="shell page">
    <h2 data-i18n="expPageTitle"></h2>
    <div class="timeline" style="margin-top: 28px">
      <article class="card">
        <p class="kicker" data-i18n="expUniKicker"></p>
        <h3 class="school-title">
          <span class="school-logo"><img data-local src="images/logo-hdu.jpg" alt=""></span>
          <span data-i18n="expUniTitle"></span>
        </h3>
        <p class="muted" data-i18n="expUniMeta"></p>
        <p style="margin-top: 10px" data-i18n="expUniBody"></p>
      </article>
      <article class="card">
        <p class="kicker" data-i18n="expHighKicker"></p>
        <h3 class="school-title">
          <span class="school-logo"><img data-local src="images/logo-hz4.jpg" alt=""></span>
          <span data-i18n="expHighTitle"></span>
        </h3>
        <p class="muted" data-i18n="expHighMeta"></p>
        <p style="margin-top: 10px" data-i18n="expHighBody"></p>
      </article>
      <article class="card">
        <p class="kicker" data-i18n="expJuniorKicker"></p>
        <h3 class="school-title">
          <span class="school-logo"><img data-local src="images/logo-hz15.jpg" alt=""></span>
          <span data-i18n="expJuniorTitle"></span>
        </h3>
        <p class="muted" data-i18n="expJuniorMeta"></p>
        <p style="margin-top: 10px" data-i18n="expJuniorBody"></p>
      </article>
      <article class="card">
        <p class="kicker" data-i18n="expPrimaryKicker"></p>
        <h3 class="school-title">
          <span class="school-logo"><img data-local src="images/logo-xihu.jpg" alt=""></span>
          <span data-i18n="expPrimaryTitle"></span>
        </h3>
        <p class="muted" data-i18n="expPrimaryMeta"></p>
        <p style="margin-top: 10px" data-i18n="expPrimaryBody"></p>
      </article>
    </div>
  </main>
  <script src="js/main.js"></script>
</body>
</html>
